name: Release

on:
  # A version bump landing on main cuts the release.
  push:
    branches: [main]
    paths: [Cargo.toml]
  # Or cut one by hand, optionally bumping the version first.
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the version in Cargo.toml before releasing
        type: choice
        default: none
        options:
          - none      # release whatever Cargo.toml already says
          - patch     # 26.1.0 -> 26.1.1
          - release   # 26.1.1 -> 26.2.0 (or 27.1.0 in a new year)
          - year      # -> YY.1.0 for the current year
      dry-run:
        description: Run every check but do not tag, release or publish
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are how the gate knows what the last release was.
          fetch-depth: 0
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      # Every git write below — the tag as much as the two commits — needs this,
      # and the tag is the one that runs even when there is no bump to commit.
      - name: Configure the committer
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Resolve the version to release
        id: version
        run: |
          bump='${{ inputs.bump }}'
          if [ -n "$bump" ] && [ "$bump" != none ]; then
            next="$(ci/version.fish next "$bump")"
            echo "Bumping $(ci/version.fish current) -> $next"
            ci/version.fish set "$next"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          version="$(ci/version.fish current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip a version that is already released
        id: guard
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "${{ steps.version.outputs.tag }} already exists; nothing to release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Everything below only runs for a version that is actually new. ---

      - name: Check the version policy
        if: steps.guard.outputs.proceed == 'true'
        run: ci/version.fish check --release

      - name: Check formatting
        if: steps.guard.outputs.proceed == 'true'
        run: cargo fmt --all --check

      - name: Lint
        if: steps.guard.outputs.proceed == 'true'
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Test
        if: steps.guard.outputs.proceed == 'true'
        run: |
          cargo test --all-features
          cargo test --all-features --doc
          cargo test --no-default-features
          # Building, not running: the benchmark has no test harness.
          cargo build --all-features --all-targets

      - name: Package
        if: steps.guard.outputs.proceed == 'true'
        # A requested bump is still uncommitted at this point, on purpose: the checks
        # run against the version that is about to ship.
        run: cargo publish --all-features --dry-run --allow-dirty

      - name: Commit the bump
        if: steps.guard.outputs.proceed == 'true' && steps.version.outputs.bumped == 'true' && !inputs.dry-run
        run: |
          git add Cargo.toml
          git commit -m 'Release ${{ steps.version.outputs.version }}'
          git push origin HEAD:main

      - name: Tag
        id: tag
        if: steps.guard.outputs.proceed == 'true' && !inputs.dry-run
        run: |
          git tag -a '${{ steps.version.outputs.tag }}' -m 'cobra ${{ steps.version.outputs.version }}'
          git push origin '${{ steps.version.outputs.tag }}'

      - name: Create the GitHub release
        if: steps.guard.outputs.proceed == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' \
            --title 'cobra ${{ steps.version.outputs.version }}' \
            --generate-notes

      - name: Publish to crates.io
        if: steps.guard.outputs.proceed == 'true' && !inputs.dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::notice::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish.'
            exit 0
          fi
          cargo publish --all-features

      # Main must always sit ahead of the newest tag, which is what `ci/version.fish
      # check` enforces on every pull request. Opening the next patch here keeps that
      # true without anyone having to remember. Pushes made with GITHUB_TOKEN do not
      # start new workflow runs, so this does not re-trigger the release.
      #
      # The tag, not the whole job, is what makes this necessary: once `v26.1.0` exists,
      # main reading `26.1.0` fails the gate on every pull request. So this runs whenever
      # the tag went out, even if the GitHub release or the crates.io publish failed
      # afterwards — those are re-runnable, a repository-wide red gate is not. Bumping the
      # patch is also all it does: a release that should raise the minor instead says so at
      # release time, via the `release` bump on workflow_dispatch.
      - name: Open the next development version
        if: "!cancelled() && steps.tag.outcome == 'success'"
        run: |
          next="$(ci/version.fish next patch)"
          ci/version.fish set "$next"
          git add Cargo.toml
          git commit -m "Open $next for development [skip ci]"
          git push origin HEAD:main
